user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    # worker_connections 512;
    # multi_accept off;
}

http {
    ##
    # Basic Settings
    ##

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # SSL Settings
    ##

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDH+AESGCM:ECDH+AES256:ECDH+AES128:DHE+AES128:!ADH:!AECDH:!MD5;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 60m;

    # HSTS, on HTTPS responses only. A header over plain HTTP is ignored by
    # browsers, and an empty value makes add_header send nothing, so the
    # port-80 listener stays as it is: behind Cloudflare in "Flexible" mode
    # the edge reaches the origin over HTTP, and redirecting that would loop.
    map $scheme $hsts {
        https "max-age=31536000; includeSubDomains";
        default "";
    }

    ##
    # Logging Settings
    ##

    map $status $loggable {
        default 1;
        '~^444$' 0;
    }

    access_log /var/log/nginx/access.log combined if=$loggable;
    error_log /var/log/nginx/error.log;

    ##
    # Gzip Settings
    ##

    gzip on;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
    gzip_static on;

    ##
    # Virtual Host Configs
    ##

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
