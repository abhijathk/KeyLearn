<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <title>KeyLearn</title>
  <!--
    One of the three caps from the wordmark, cropped tight.

    A favicon cannot read the app's accent — it is a file the browser fetches
    with no page around it — so it does what the previous favicon did: the
    signature mint, day tone by default and night tone under
    prefers-color-scheme. The day tone is the base rather than the media-query
    branch, because a browser that ignores the query should land on the darker
    of the two, which stays legible on the light chrome those browsers have.
  -->
  <style>
    .top { fill: #2f8a5d; } .wall { fill: #1e6a43; } .ink { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .top { fill: #8fd9b6; } .wall { fill: #5aa17e; } .ink { fill: #241a12; }
    }
  </style>
  <rect x="8" y="24.7" width="104" height="93.6" rx="19.8" class="wall"/>
  <rect x="8" y="14.3" width="104" height="87.4" rx="17.8" class="top"/>
  <g class="ink" transform="translate(36.8, 81.9)"><g transform="scale(0.0673, -0.0673)"><path d="M74 0V710H226V400L484 710H661L400 397L677 0H504L300 295L226 209V0Z"/></g></g>
</svg>
