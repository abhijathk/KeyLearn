name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
      - name: CI
        run: |
          npm ci
          npm run compile
          npm run lint
          npm run stylelint
          npm run check-changelog
          npm run check-messages
          npm run build -- --no-stats
          npm run test
        env:
          DATABASE_CLIENT: sqlite
          NODE_COMPILE_CACHE: /tmp/node-compile-cache

  # The same suite against the database production actually runs.
  #
  # The job above uses sqlite because it needs no service and is quick, and
  # for most of the suite the dialect is irrelevant. It is not always
  # irrelevant: a Date column declared in a model's jsonSchema is
  # serialised on its way to the driver, which sqlite accepts and MySQL
  # rejects outright — so a delivery-tracking column once passed every
  # check here and would have failed on every write in production. A whole
  # class of bug is invisible to a sqlite-only suite, and this is the
  # cheapest way to see it.
  mysql:
    runs-on: ubuntu-latest

    steps:
      # Started by hand rather than as a service, because a service cannot
      # pass flags to mysqld. MySQL 8.4 ships with mysql_native_password
      # switched off, and the app's (deliberately legacy) `mysql` driver
      # cannot speak caching_sha2_password: every connection failed with
      # ER_NOT_SUPPORTED_AUTH_MODE. Production turns the plugin on and gives
      # the keylearn user a native password (docs/go-live.md); this does the
      # same. The loop waits for TCP, which the entrypoint's temporary
      # server never opens, so the user is made on the real one.
      - name: Start MySQL 8.4, native passwords on (as in production)
        run: |
          docker run -d --name mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=keylearn_tests \
            mysql:8.4 --mysql-native-password=ON
          for i in $(seq 90); do
            docker exec mysql mysql -h127.0.0.1 -uroot -proot -e "SELECT 1" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec mysql mysql -h127.0.0.1 -uroot -proot -e "
            CREATE USER 'keylearn'@'%' IDENTIFIED WITH mysql_native_password BY 'keylearn';
            GRANT ALL PRIVILEGES ON keylearn_tests.* TO 'keylearn'@'%';"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
      - name: Test against MySQL
        run: |
          npm ci
          npm run compile
          npm run test
        env:
          DATABASE_CLIENT: mysql
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: "3306"
          DATABASE_DATABASE: keylearn_tests
          DATABASE_USERNAME: keylearn
          DATABASE_PASSWORD: keylearn
          NODE_COMPILE_CACHE: /tmp/node-compile-cache

  # Kept separate from the build so a newly-published advisory shows up as its
  # own red check rather than as a confusing build failure — and so it can be
  # read at a glance without digging through compile output.
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
      - run: npm ci

      # Production dependencies are the ones an attacker can reach at runtime,
      # so they are the gate. A high or critical advisory fails the build.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Dev dependencies still matter (a compromised build tool is a supply
      # chain problem) but should not block a release, so they are reported
      # without failing.
      - name: Audit all dependencies (report only)
        if: always()
        run: npm audit || true

  secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Scan the whole history, not just the tip: a secret committed and
          # later "removed" is still in the history and still compromised.
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
